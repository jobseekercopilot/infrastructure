<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
  <title id="title">Job Seeker Copilot product journey</title>
  <desc id="desc">Eight connected steps from account creation to reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#f4efff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d7c9b"/></marker>
  </defs>
  <rect width="1400" height="300" rx="30" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g stroke="#6d7c9b" stroke-width="4" marker-end="url(#arrow)">
      <path d="M180 150H230"/><path d="M350 150H400"/><path d="M520 150H570"/><path d="M690 150H740"/>
      <path d="M860 150H910"/><path d="M1030 150H1080"/><path d="M1200 150H1250"/>
    </g>
    <g font-size="22" font-weight="700" fill="#14213d">
      <g><circle cx="120" cy="150" r="56" fill="#fff" stroke="#2f6df6" stroke-width="4"/><text x="120" y="143">Create</text><text x="120" y="170">account</text></g>
      <g><circle cx="290" cy="150" r="56" fill="#fff" stroke="#2f6df6" stroke-width="4"/><text x="290" y="143">Build</text><text x="290" y="170">profile</text></g>
      <g><circle cx="460" cy="150" r="56" fill="#fff" stroke="#2f6df6" stroke-width="4"/><text x="460" y="143">Discover</text><text x="460" y="170">jobs</text></g>
      <g><circle cx="630" cy="150" r="56" fill="#fff" stroke="#2f6df6" stroke-width="4"/><text x="630" y="143">Review</text><text x="630" y="170">details</text></g>
      <g><circle cx="800" cy="150" r="56" fill="#fff" stroke="#6c4cf1" stroke-width="4"/><text x="800" y="143">Save &amp;</text><text x="800" y="170">track</text></g>
      <g><circle cx="970" cy="150" r="56" fill="#fff" stroke="#6c4cf1" stroke-width="4"/><text x="970" y="143">Generate</text><text x="970" y="170">documents</text></g>
      <g><circle cx="1140" cy="150" r="56" fill="#fff" stroke="#00a685" stroke-width="4"/><text x="1140" y="143">Manage</text><text x="1140" y="170">versions</text></g>
      <g><circle cx="1310" cy="150" r="56" fill="#fff" stroke="#00a685" stroke-width="4"/><text x="1310" y="143">Review</text><text x="1310" y="170">reporting</text></g>
    </g>
  </g>
</svg>
