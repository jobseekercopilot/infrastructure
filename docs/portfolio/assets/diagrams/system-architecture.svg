<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">High-level Job Seeker Copilot architecture</title>
  <desc id="desc">Browser and BFF connect to domain-aligned gateways and services, persistent stores and isolated external-provider gateways.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#65748f"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="850" rx="28" fill="#f6f8fc"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="60" y="60" font-size="28" font-weight="800" fill="#14213d">Client boundary</text>
    <rect x="60" y="85" width="1280" height="105" rx="18" fill="#fff" stroke="#2f6df6" stroke-width="3" filter="url(#shadow)"/>
    <text x="700" y="132" text-anchor="middle" font-size="25" font-weight="800" fill="#14213d">Angular 21 UI + Express SSR / same-origin BFF</text>
    <text x="700" y="165" text-anchor="middle" font-size="18" fill="#53627c">HttpOnly session boundary · explicit route allowlist · no provider credentials in the browser</text>

    <text x="60" y="245" font-size="28" font-weight="800" fill="#14213d">Product domains</text>
    <g font-size="18" font-weight="700" text-anchor="middle" fill="#14213d">
      <g><rect x="60" y="270" width="235" height="105" rx="16" fill="#eaf1ff" stroke="#2f6df6" stroke-width="2"/><text x="177" y="314">Identity &amp; profile</text><text x="177" y="344" font-size="15" font-weight="500">Auth · UMG · Profile</text></g>
      <g><rect x="315" y="270" width="235" height="105" rx="16" fill="#eaf1ff" stroke="#2f6df6" stroke-width="2"/><text x="432" y="314">Job discovery</text><text x="432" y="344" font-size="15" font-weight="500">Finder · Job · Matching</text></g>
      <g><rect x="570" y="270" width="235" height="105" rx="16" fill="#f1edff" stroke="#6c4cf1" stroke-width="2"/><text x="687" y="314">Applications</text><text x="687" y="344" font-size="15" font-weight="500">Lifecycle · exact refs</text></g>
      <g><rect x="825" y="270" width="235" height="105" rx="16" fill="#f1edff" stroke="#6c4cf1" stroke-width="2"/><text x="942" y="306">Documents &amp;</text><text x="942" y="331">generation</text><text x="942" y="358" font-size="15" font-weight="500">Coordinator · CV · Store · Export</text></g>
      <g><rect x="1080" y="270" width="260" height="105" rx="16" fill="#e8faf5" stroke="#00a685" stroke-width="2"/><text x="1210" y="306">Reporting · payments</text><text x="1210" y="334">· location</text><text x="1210" y="360" font-size="15" font-weight="500">Read models · wallet · commute</text></g>
    </g>

    <text x="60" y="440" font-size="28" font-weight="800" fill="#14213d">Owned state</text>
    <g font-size="17" text-anchor="middle">
      <rect x="60" y="465" width="870" height="100" rx="18" fill="#fff" stroke="#c7d2e6" stroke-width="2"/>
      <text x="495" y="507" font-weight="800" fill="#14213d">Seven independent PostgreSQL owners</text>
      <text x="495" y="539" fill="#53627c">accounts · profiles · saved jobs · operations · documents · applications · AI-credit ledger</text>
      <rect x="960" y="465" width="380" height="100" rx="18" fill="#fff" stroke="#c7d2e6" stroke-width="2"/>
      <text x="1150" y="507" font-weight="800" fill="#14213d">Document bytes</text>
      <text x="1150" y="539" fill="#53627c">filesystem locally · object-store boundary</text>
    </g>

    <text x="60" y="630" font-size="28" font-weight="800" fill="#14213d">External-provider boundaries</text>
    <g font-size="17" font-weight="700" text-anchor="middle" fill="#14213d">
      <rect x="60" y="655" width="190" height="80" rx="15" fill="#fff" stroke="#8da4cf" stroke-width="2"/><text x="155" y="686">Job providers</text><text x="155" y="713" font-size="14" font-weight="500">Reed · Adzuna · JSearch</text>
      <rect x="270" y="655" width="190" height="80" rx="15" fill="#fff" stroke="#8da4cf" stroke-width="2"/><text x="365" y="686">Specialists</text><text x="365" y="713" font-size="14" font-weight="500">NHS · Apprenticeships</text>
      <rect x="480" y="655" width="190" height="80" rx="15" fill="#fff" stroke="#8da4cf" stroke-width="2"/><text x="575" y="686">Location</text><text x="575" y="713" font-size="14" font-weight="500">Postcodes.io · Google</text>
      <rect x="690" y="655" width="190" height="80" rx="15" fill="#fff" stroke="#8da4cf" stroke-width="2"/><text x="785" y="686">AI</text><text x="785" y="713" font-size="14" font-weight="500">OpenAI via LLM Gateway</text>
      <rect x="900" y="655" width="190" height="80" rx="15" fill="#fff" stroke="#8da4cf" stroke-width="2"/><text x="995" y="686">Payments</text><text x="995" y="713" font-size="14" font-weight="500">Stripe (browser disabled)</text>
      <rect x="1110" y="655" width="230" height="80" rx="15" fill="#fff" stroke="#00a685" stroke-width="2"/><text x="1225" y="686">System Data</text><text x="1225" y="713" font-size="14" font-weight="500">deterministic non-production fixtures</text>
    </g>
    <g stroke="#65748f" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M700 190V250"/><path d="M700 375V445"/><path d="M700 565V625"/>
    </g>
  </g>
</svg>
