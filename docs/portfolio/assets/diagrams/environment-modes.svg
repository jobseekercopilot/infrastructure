<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <defs><style>.h{font:800 23px Arial;fill:#14213d}.p{font:17px Arial;fill:#53627c}.b{fill:#fff;stroke:#b9c9e5;stroke-width:3}.g{fill:#eefaf7;stroke:#68c2ab}.v{fill:#f5f1ff;stroke:#9880e8}.o{fill:#fff7eb;stroke:#e4a24a}</style></defs>
  <rect width="1400" height="600" rx="28" fill="#f8faff"/>
  <g transform="translate(50 70)"><rect class="g" width="400" height="200" rx="18"/><text class="h" x="28" y="48">Deterministic engineering</text><text class="p" x="28" y="85">basic-fixture · full-fixture · local SES</text><text class="p" x="28" y="120">canonical personas and provider fixtures</text><text class="p" x="28" y="150">repeatable CI · no provider spend</text><text class="p" x="28" y="178">resettable, disposable state</text></g>
  <g transform="translate(500 70)"><rect class="v" width="400" height="200" rx="18"/><text class="h" x="28" y="48">Bounded provider validation</text><text class="p" x="28" y="85">google-maps-smoke · real-job-providers</text><text class="p" x="28" y="120">selected live boundary only</text><text class="p" x="28" y="150">explicit credentials and cost authority</text><text class="p" x="28" y="178">point-in-time shape/quality evidence</text></g>
  <g transform="translate(950 70)"><rect class="o" width="400" height="200" rx="18"/><text class="h" x="28" y="48">Persistent manual user</text><text class="p" x="28" y="85">real-providers</text><text class="p" x="28" y="120">real profile · live jobs · Google · OpenAI</text><text class="p" x="28" y="150">persistent owner databases/documents</text><text class="p" x="28" y="178">never reset with canonical personas</text></g>
  <g transform="translate(230 350)"><rect class="b" width="940" height="160" rx="18"/><text class="h" x="30" y="50">One catalogue, explicit overlays</text><text class="p" x="30" y="86">Compose topology + repository revision lock + generated service identities + health/mode verification</text><text class="p" x="30" y="120">The safety property is separation: deterministic evidence never silently spends money; real use never contaminates canonical fixtures.</text></g>
</svg>
