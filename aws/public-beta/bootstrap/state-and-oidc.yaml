AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Manual, one-time Job Seeker Copilot public-beta foundation. Creates the
  encrypted Terraform backend, GitHub OIDC roles and retained opaque-ID
  encryption/backup/notification/cost-anomaly resources that routine apply is
  deliberately unable to claim or destroy. This template is never invoked by
  a repository workflow.

Parameters:
  StateBucketName:
    Type: String
    AllowedPattern: '^(?!jsc-public-beta-(access-logs|documents|erasure-journal)-)[a-z0-9][a-z0-9.-]{3,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid unique bucket name outside the reserved application bucket prefixes.
  GitHubOrganisation:
    Type: String
    Default: jobseekercopilot
  GitHubOrganisationId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: Immutable GitHub owner ID used in OIDC subjects for repositories created after 2026-07-15.
  GitHubRepository:
    Type: String
    Default: infrastructure
  GitHubRepositoryId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: Immutable GitHub repository ID used in OIDC subjects for repositories created after 2026-07-15.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Supply the account's existing token.actions.githubusercontent.com provider, if present.
  GitHubOidcThumbprint:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'
    NoEcho: true
    Description: Review against GitHub/AWS guidance immediately before a manual bootstrap change set.
  Route53HostedZoneArn:
    Type: String
    AllowedPattern: '^arn:aws:route53:::hostedzone/[A-Z0-9]+$'
  AppDomainName:
    Type: String
    Default: app.jobseekercopilot.com
    AllowedPattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
    Description: Exact application host; IAM permits only it and its ACM validation records in the shared zone.
  PlanEnvironmentName:
    Type: String
    Default: production-aws-plan
  BuildEnvironmentName:
    Type: String
    Default: production-build
  ApplyEnvironmentName:
    Type: String
    Default: production-aws
  ErasureJournalRetentionDays:
    Type: Number
    MinValue: 36
    MaxValue: 400
    Description: >-
      Reviewed retention for encrypted permanent-erasure replay material. It
      must exceed the 35-day customer-data backup maximum and be approved by
      the privacy and disaster-recovery owners.
  MonthlyBudgetUsd:
    Type: Number
    Default: 750
    MinValue: 100
    MaxValue: 750
    Description: >-
      Monthly AWS alert budget in USD. This is an alert threshold, never a
      hard spending cap; raising it requires a separately reviewed foundation
      change.
  OperationsNotificationEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: >-
      Confirmed owner mailbox for budget, anomaly, backup and operational
      alerts. The SNS confirmation email must be accepted before activation.
  ExistingCostAnomalyMonitorArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:ce::[0-9]{12}:anomalymonitor/[A-Za-z0-9-]+$'
    Description: >-
      Existing account-wide AWS-services anomaly monitor. Leave empty only
      when the account has no DIMENSIONAL SERVICE monitor.
  EcsAmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Exact reviewed Amazon Linux 2023 ECS-optimised AMI. Rotate this manual
      foundation input before a protected Terraform release changes AMI.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  CreateCostAnomalyMonitor: !Equals [!Ref ExistingCostAnomalyMonitorArn, '']

Resources:
  StateKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Job Seeker Copilot public-beta Terraform state
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  StateKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/jsc-public-beta-terraform-state
      TargetKeyId: !Ref StateKey

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref StateBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StateKey.Arn
              SSEAlgorithm: aws:kms
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainRecoverableNoncurrentState
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyUnencryptedObjectWrites
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${StateBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyMissingStateKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${StateBucket.Arn}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'true'
          - Sid: DenyWrongStateKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${StateBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt StateKey.Arn

  ApplicationDataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Job Seeker Copilot public-beta customer-data encryption foundation
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: EncryptOnlyPublicBetaCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/jsc/public-beta/*
          - Sid: AllowAutoScalingServiceLinkedRoleUse
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: '*'
          - Sid: AllowAutoScalingServiceLinkedRoleGrant
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling
            Action: kms:CreateGrant
            Resource: '*'
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'
      Tags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta
        - Key: DataClass
          Value: customer-confidential

  ApplicationDataKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/jsc-public-beta-data
      TargetKeyId: !Ref ApplicationDataKey

  ErasureJournalKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Job Seeker Copilot permanent-erasure journal encryption foundation
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Foundation
          Value: ErasureJournal
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta
        - Key: DataClass
          Value: restricted-recovery

  ErasureJournalKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/jsc-public-beta-erasure-journal
      TargetKeyId: !Ref ErasureJournalKey

  ErasureJournalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub jsc-public-beta-erasure-journal-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt ErasureJournalKey.Arn
              SSEAlgorithm: aws:kms
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref ErasureJournalRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReviewedReplayMaterial
            Status: Enabled
            ExpirationInDays: !Ref ErasureJournalRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref ErasureJournalRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Foundation
          Value: ErasureJournal
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta
        - Key: DataClass
          Value: restricted-recovery
        - Key: ExcludedFromCustomerDataBackup
          Value: 'true'

  ErasureJournalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ErasureJournalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ErasureJournalBucket.Arn
              - !Sub '${ErasureJournalBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyMissingJournalEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ErasureJournalBucket.Arn}/permanent-erasures/v1/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'true'
          - Sid: DenyWrongJournalEncryptionAlgorithm
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ErasureJournalBucket.Arn}/permanent-erasures/v1/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyMissingJournalKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ErasureJournalBucket.Arn}/permanent-erasures/v1/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'true'
          - Sid: DenyWrongJournalKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ErasureJournalBucket.Arn}/permanent-erasures/v1/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt ErasureJournalKey.Arn

  NotificationKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Job Seeker Copilot public-beta operational notification encryption foundation
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: EncryptOperationalNotifications
            Effect: Allow
            Principal:
              Service:
                - backup.amazonaws.com
                - budgets.amazonaws.com
                - cloudwatch.amazonaws.com
                - costalerts.amazonaws.com
                - sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta
        - Key: DataClass
          Value: operational

  NotificationKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/jsc-public-beta-notifications
      TargetKeyId: !Ref NotificationKey

  OperationsTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TopicName: jsc-public-beta-operations
      KmsMasterKeyId: !GetAtt NotificationKey.Arn
      Tags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  OperationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Topics:
        - !Ref OperationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OwnerAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - sns:AddPermission
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:Publish
              - sns:RemovePermission
              - sns:SetTopicAttributes
              - sns:Subscribe
            Resource: !Ref OperationsTopic
          - Sid: AwsAlertPublishers
            Effect: Allow
            Principal:
              Service:
                - backup.amazonaws.com
                - budgets.amazonaws.com
                - cloudwatch.amazonaws.com
                - costalerts.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OperationsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OperationsTopic
      Protocol: email
      Endpoint: !Ref OperationsNotificationEmail

  MonthlyCostAlertBudget:
    Type: AWS::Budgets::Budget
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: OperationsTopicPolicy
    Properties:
      Budget:
        BudgetName: jsc-public-beta-monthly-actual-spend
        BudgetType: COST
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:CostCentre$public-beta
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 350
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 500
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 560
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 650
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 700
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
      ResourceTags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  MonthlyCostCeilingBudget:
    Type: AWS::Budgets::Budget
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: OperationsTopicPolicy
    Properties:
      Budget:
        BudgetName: jsc-public-beta-monthly-ceiling-and-forecast
        BudgetType: COST
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:CostCentre$public-beta
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 750
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 350
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 500
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 560
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 650
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
      ResourceTags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  MonthlyCostCriticalForecastBudget:
    Type: AWS::Budgets::Budget
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: OperationsTopicPolicy
    Properties:
      Budget:
        BudgetName: jsc-public-beta-monthly-critical-forecast
        BudgetType: COST
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:CostCentre$public-beta
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 700
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 750
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref OperationsTopic
              SubscriptionType: SNS
      ResourceTags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  CustomerDataBackupVault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: OperationsTopicPolicy
    Properties:
      BackupVaultName: jsc-public-beta-customer-data
      EncryptionKeyArn: !GetAtt ApplicationDataKey.Arn
      LockConfiguration:
        MinRetentionDays: 7
        MaxRetentionDays: 35
      Notifications:
        BackupVaultEvents:
          - BACKUP_JOB_FAILED
          - COPY_JOB_FAILED
          - RESTORE_JOB_FAILED
        SNSTopicArn: !Ref OperationsTopic
      BackupVaultTags:
        Application: Job Seeker Copilot
        Environment: public-beta
        ManagedBy: CloudFormation-bootstrap
        CostCentre: public-beta
        DataClass: customer-confidential

  CustomerDataBackupPlan:
    Type: AWS::Backup::BackupPlan
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupPlan:
        BackupPlanName: jsc-public-beta-customer-data
        BackupPlanRule:
          - RuleName: daily-35-day-retention
            TargetBackupVault: !Ref CustomerDataBackupVault
            ScheduleExpression: cron(0 5 * * ? *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 360
            Lifecycle:
              DeleteAfterDays: 35
            RecoveryPointTags:
              Application: Job Seeker Copilot
              Environment: public-beta
              ManagedBy: AWS-Backup
              RestoreTest: quarterly
      BackupPlanTags:
        Application: Job Seeker Copilot
        Environment: public-beta
        ManagedBy: CloudFormation-bootstrap
        CostCentre: public-beta

  ServiceCostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Condition: CreateCostAnomalyMonitor
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MonitorName: jsc-public-beta-aws-services
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE
      ResourceTags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  DailyCostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: OperationsTopicPolicy
    Properties:
      SubscriptionName: jsc-public-beta-cost-anomalies
      Frequency: IMMEDIATE
      MonitorArnList:
        - !If
          - CreateCostAnomalyMonitor
          - !GetAtt ServiceCostAnomalyMonitor.MonitorArn
          - !Ref ExistingCostAnomalyMonitorArn
      Subscribers:
        - Type: SNS
          Address: !Ref OperationsTopic
      ThresholdExpression: '{"Dimensions":{"Key":"ANOMALY_TOTAL_IMPACT_ABSOLUTE","MatchOptions":["GREATER_THAN_OR_EQUAL"],"Values":["20"]}}'
      ResourceTags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: Environment
          Value: public-beta
        - Key: ManagedBy
          Value: CloudFormation-bootstrap
        - Key: CostCentre
          Value: public-beta

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - !Ref GitHubOidcThumbprint
      Tags:
        - Key: Application
          Value: Job Seeker Copilot
        - Key: ManagedBy
          Value: CloudFormation-bootstrap

  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jsc-public-beta-github-plan
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganisation}@${GitHubOrganisationId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${PlanEnvironmentName}
      Policies:
        - PolicyName: StateRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub '${StateBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:PutObject
                Resource: !Sub '${StateBucket.Arn}/public-beta/terraform.tfstate.tflock'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt StateKey.Arn
        - PolicyName: PublicBetaReadOnlyPlan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - autoscaling:Describe*
                  - backup:Describe*
                  - backup:Get*
                  - backup:List*
                  - ce:Get*
                  - ce:ListTagsForResource
                  - cloudwatch:Describe*
                  - cloudwatch:GetDashboard
                  - cloudwatch:List*
                  - ec2:Describe*
                  - ecr:Describe*
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:List*
                  - ecs:Describe*
                  - ecs:List*
                  - elasticloadbalancing:Describe*
                  - iam:Get*
                  - iam:List*
                  - kms:Describe*
                  - kms:GetKeyPolicy
                  - kms:List*
                  - logs:Describe*
                  - logs:List*
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - route53:Get*
                  - route53:List*
                  - s3:GetBucket*
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetPublicAccessBlock
                  - s3:GetReplicationConfiguration
                  - s3:ListAllMyBuckets
                  - s3:ListBucket
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecrets
                  - servicediscovery:Get*
                  - servicediscovery:List*
                  - sns:GetSubscriptionAttributes
                  - sns:GetTopicAttributes
                  - sns:List*
                  - ssm:GetParameter
                  - ssm:ListTagsForResource
                  - wafv2:Get*
                  - wafv2:List*
                Resource: '*'

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jsc-public-beta-github-build
      MaxSessionDuration: 10800
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganisation}@${GitHubOrganisationId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${BuildEnvironmentName}
      Policies:
        - PolicyName: ImmutableReleaseImagePublisher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImageScanFindings
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:StartImageScan
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/jsc-public-beta/*

  WorkloadPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: jsc-public-beta-workload-boundary
      Description: >-
        Maximum permissions for Terraform-created public-beta workload roles.
        The GitHub plan/build/apply roles cannot use this boundary to grant
        IAM, STS, Organizations or account-administration permissions.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RuntimeControlPlaneCallsWithoutResourceArns
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - ec2:DescribeInstanceStatus
              - ec2:DescribeTags
              - ecr:GetAuthorizationToken
              - ecs:DiscoverPollEndpoint
              - ecs:Poll
              - ecs:RegisterContainerInstance
              - ecs:StartTelemetrySession
              - ecs:SubmitAttachmentStateChanges
              - ecs:SubmitContainerStateChange
              - ecs:SubmitTaskStateChange
              - logs:DescribeLogGroups
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Sid: ReadOnlyRuntimeParameters
            Effect: Allow
            Action:
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
              - ssm:DescribeAssociation
              - ssm:DescribeDocument
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:GetManifest
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
            Resource: '*'
          - Sid: PullOnlyPublicBetaImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/jsc-public-beta/*
          - Sid: WriteOnlyPublicBetaLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/jsc/public-beta/*
          - Sid: ReadOnlyDeclaredPublicBetaSecrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:jsc-public-beta/*
          - Sid: ReadOnlyPublicBetaRdsManagedMasterSecret
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*
            Condition:
              StringEquals:
                'secretsmanager:ResourceTag/aws:secretsmanager:owningService': rds
              StringLike:
                'secretsmanager:ResourceTag/aws:rds:primaryDBInstanceArn': !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-postgres
          - Sid: UseOnlyFoundationPublicBetaDataKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: !GetAtt ApplicationDataKey.Arn
          - Sid: GrantFoundationDataKeyOnlyToAwsResources
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !GetAtt ApplicationDataKey.Arn
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'
          - Sid: PublicBetaBucketsOnly
            Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetBucketLocation
              - s3:GetBucketNotification
              - s3:GetBucketTagging
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetObject
              - s3:GetObjectAttributes
              - s3:GetObjectTagging
              - s3:GetObjectVersion
              - s3:GetObjectVersionAttributes
              - s3:GetObjectVersionTagging
              - s3:ListBucket
              - s3:ListBucketMultipartUploads
              - s3:ListBucketVersions
              - s3:ListMultipartUploadParts
              - s3:PutObject
              - s3:PutObjectTagging
              - s3:RestoreObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-access-logs-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-access-logs-${AWS::AccountId}/*
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-documents-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-documents-${AWS::AccountId}/*
          - Sid: WriteOnlyImmutableErasureJournalRecords
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub '${ErasureJournalBucket.Arn}/permanent-erasures/v1/*'
            Condition:
              StringEquals:
                s3:x-amz-server-side-encryption: aws:kms
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt ErasureJournalKey.Arn
          - Sid: ReadOnlyBoundErasureJournalRecords
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub '${ErasureJournalBucket.Arn}/permanent-erasures/v1/*'
          - Sid: UseOnlyErasureJournalKeyThroughS3
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !GetAtt ErasureJournalKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
                kms:EncryptionContext:aws:s3:arn: !GetAtt ErasureJournalBucket.Arn
  BackupWorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: jsc-public-beta-backup-boundary
      Description: Maximum permissions for the exact RDS and document-bucket scheduled backup role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequiredBackupReadDiscovery
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - events:ListRules
              - rds:DescribeDBInstances
              - rds:DescribeDBSnapshots
              - rds:ListTagsForResource
              - s3:ListAllMyBuckets
              - tag:GetResources
            Resource: '*'
          - Sid: ExactBackupManagedEventRules
            Effect: Allow
            Action:
              - events:DeleteRule
              - events:DescribeRule
              - events:DisableRule
              - events:EnableRule
              - events:ListTargetsByRule
              - events:PutRule
              - events:PutTargets
              - events:RemoveTargets
            Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/AwsBackupManagedRule*
          - Sid: ExactPublicBetaRdsBackup
            Effect: Allow
            Action:
              - rds:AddTagsToResource
              - rds:CopyDBSnapshot
              - rds:CreateDBSnapshot
              - rds:DeleteDBSnapshot
              - rds:ModifyDBSnapshotAttribute
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-postgres
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:awsbackup:*
          - Sid: ExactCustomerDataVaultBackup
            Effect: Allow
            Action:
              - backup:CopyIntoBackupVault
              - backup:DescribeBackupVault
            Resource: !GetAtt CustomerDataBackupVault.BackupVaultArn
          - Sid: ExactRecoveryPointTagging
            Effect: Allow
            Action: backup:TagResource
            Resource: !Sub arn:${AWS::Partition}:backup:${AWS::Region}:${AWS::AccountId}:recovery-point:*
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId
          - Sid: ExactDocumentsBucketBackup
            Effect: Allow
            Action:
              - s3:GetBucketAcl
              - s3:GetBucketLocation
              - s3:GetBucketNotification
              - s3:GetBucketTagging
              - s3:GetBucketVersioning
              - s3:GetInventoryConfiguration
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:PutBucketNotification
              - s3:PutInventoryConfiguration
            Resource: !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-documents-${AWS::AccountId}
          - Sid: ExactDocumentsObjectBackup
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectAcl
              - s3:GetObjectTagging
              - s3:GetObjectVersion
              - s3:GetObjectVersionAcl
              - s3:GetObjectVersionTagging
            Resource: !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-documents-${AWS::AccountId}/*
          - Sid: DescribeOnlyFoundationDataKeyForBackup
            Effect: Allow
            Action: kms:DescribeKey
            Resource: !GetAtt ApplicationDataKey.Arn
          - Sid: UseOnlyFoundationDataKeyForBackup
            Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt ApplicationDataKey.Arn
            Condition:
              StringLike:
                kms:ViaService:
                  - !Sub rds.${AWS::Region}.amazonaws.com
                  - !Sub s3.${AWS::Region}.amazonaws.com
          - Sid: GrantFoundationDataKeyOnlyToBackupResources
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !GetAtt ApplicationDataKey.Arn
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'

  BackupRestoreWorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: jsc-public-beta-backup-restore-boundary
      Description: Maximum permissions for isolated RDS and S3 restore drills; production resources are excluded.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequiredRestoreReadDiscovery
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - rds:DescribeDBSnapshots
              - rds:ListTagsForResource
            Resource: '*'
          - Sid: ExactIsolatedRdsRestoreTargetLifecycle
            Effect: Allow
            Action:
              - rds:AddTagsToResource
              - rds:DeleteDBInstance
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-restore-*
          - Sid: ExactPrivateIsolatedRdsSnapshotRestoreTarget
            Effect: Allow
            Action: rds:RestoreDBInstanceFromDBSnapshot
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-restore-*
            Condition:
              Bool:
                rds:PubliclyAccessible: 'false'
          - Sid: ExactIsolatedRdsSnapshotRestoreInputs
            Effect: Allow
            Action: rds:RestoreDBInstanceFromDBSnapshot
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:awsbackup:*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:jsc-public-beta-postgres15-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:jsc-public-beta-postgres
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:og:default:postgres-15
          - Sid: ExactIsolatedRestoreBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetBucketOwnershipControls
              - s3:GetBucketVersioning
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:PutBucketOwnershipControls
              - s3:PutBucketVersioning
            Resource: !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-restore-${AWS::AccountId}-*
          - Sid: ExactIsolatedRestoreObjects
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:GetObjectAcl
              - s3:GetObjectTagging
              - s3:GetObjectVersion
              - s3:GetObjectVersionAcl
              - s3:ListMultipartUploadParts
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:PutObjectTagging
              - s3:PutObjectVersionAcl
            Resource: !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-restore-${AWS::AccountId}-*/*
          - Sid: DescribeOnlyFoundationDataKeyForRestore
            Effect: Allow
            Action: kms:DescribeKey
            Resource: !GetAtt ApplicationDataKey.Arn
          - Sid: UseOnlyFoundationDataKeyForRestore
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: !GetAtt ApplicationDataKey.Arn
            Condition:
              StringLike:
                kms:ViaService:
                  - !Sub rds.${AWS::Region}.amazonaws.com
                  - !Sub s3.${AWS::Region}.amazonaws.com
          - Sid: GrantFoundationDataKeyOnlyToRestoreResources
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !GetAtt ApplicationDataKey.Arn
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'

  ApplyDiscoveryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-discovery
      Description: Read-only discovery required by the reviewed public-beta Terraform stack.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyDiscovery
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:ListTagsForCertificate
              - autoscaling:Describe*
              - backup:Describe*
              - backup:Get*
              - backup:List*
              - ce:Describe*
              - ce:Get*
              - ce:List*
              - cloudwatch:Describe*
              - cloudwatch:Get*
              - cloudwatch:List*
              - ec2:Describe*
              - ec2:GetSecurityGroupsForVpc
              - ecr:Describe*
              - ecr:GetLifecyclePolicy
              - ecr:GetRepositoryPolicy
              - ecr:List*
              - ecs:Describe*
              - ecs:List*
              - elasticloadbalancing:Describe*
              - iam:GetInstanceProfile
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfileTags
              - iam:ListInstanceProfilesForRole
              - iam:ListPolicyVersions
              - iam:ListRolePolicies
              - iam:ListRoles
              - iam:ListRoleTags
              - kms:Describe*
              - kms:GetKeyPolicy
              - kms:List*
              - logs:Describe*
              - logs:List*
              - rds:Describe*
              - rds:ListTagsForResource
              - s3:GetAccountPublicAccessBlock
              - s3:GetAccelerateConfiguration
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetPublicAccessBlock
              - s3:GetReplicationConfiguration
              - s3:ListAllMyBuckets
              - s3:ListBucket
              - secretsmanager:DescribeSecret
              - secretsmanager:GetResourcePolicy
              - secretsmanager:ListSecrets
              - servicediscovery:Get*
              - servicediscovery:List*
              - sns:Get*
              - sns:List*
              - wafv2:Get*
              - wafv2:List*
            Resource: '*'
          - Sid: ReadOnlyExactHostedZone
            Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
              - route53:ListTagsForResource
            Resource: !Ref Route53HostedZoneArn
          - Sid: ReadOnlyDnsChangeStatus
            Effect: Allow
            Action: route53:GetChange
            Resource: !Sub arn:${AWS::Partition}:route53:::change/*

  ApplyEc2NetworkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-ec2-network
      Description: >-
        EC2 network creation split between request-tagged child resources and
        already-tagged parent resources, as required by EC2 multi-resource
        authorization.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateOnlyTaggedNetworkResources
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:CreateFlowLogs
              - ec2:CreateInternetGateway
              - ec2:CreateLaunchTemplate
              - ec2:CreateNatGateway
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
              - ec2:CreateVpc
              - ec2:CreateVpcEndpoint
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: UseOnlyTaggedVpcParentsDuringCreate
            Effect: Allow
            Action:
              - ec2:CreateFlowLogs
              - ec2:CreateNatGateway
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
              - ec2:CreateVpcEndpoint
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: CreateOnlyTaggedSecurityGroupRules
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: UseOnlyTaggedSecurityGroupsForNewRules
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: TagNetworkResourcesOnlyDuringCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                ec2:CreateAction:
                  - AllocateAddress
