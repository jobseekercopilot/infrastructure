  ApplyNetworkEdgePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-network-edge
      Description: Tagged public-beta network, load-balancer, DNS and exact application-bucket lifecycle.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateOnlyTaggedLoadBalancerResources
            Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource:
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener/app/jsc-public-beta-*/*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/jsc-public-beta-*/*/*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/jsc-public-beta-*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/jscweb*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/jscpay*/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: TagLoadBalancerResourcesOnlyDuringCreate
            Effect: Allow
            Action: elasticloadbalancing:AddTags
            Resource:
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener/app/jsc-public-beta-*/*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/jsc-public-beta-*/*/*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/jsc-public-beta-*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/jscweb*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/jscpay*/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                elasticloadbalancing:CreateAction:
                  - CreateListener
                  - CreateRule
                  - CreateLoadBalancer
                  - CreateTargetGroup
          - Sid: ManageOnlyTaggedLoadBalancerResources
            Effect: Allow
            Action:
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DeleteRule
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
            Resource:
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener/app/jsc-public-beta-*/*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/jsc-public-beta-*/*/*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/jsc-public-beta-*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/jscweb*/*
              - !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/jscpay*/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: PublicBetaApplicationBucketsOnly
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:ListBucket
              - s3:PutBucketLogging
              - s3:PutBucketOwnershipControls
              - s3:PutBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketTagging
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-access-logs-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-access-logs-${AWS::AccountId}/*
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-documents-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::jsc-public-beta-documents-${AWS::AccountId}/*
          - Sid: HostedZoneRecordsOnly
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Ref Route53HostedZoneArn
            Condition:
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                  - !Ref AppDomainName
                  - !Sub '${AppDomainName}.'
                  - !Sub '*.${AppDomainName}'
                  - !Sub '*.${AppDomainName}.'
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes:
                  - A
                  - CNAME
                route53:ChangeResourceRecordSetsActions:
                  - CREATE
                  - UPSERT
                  - DELETE
  ApplyComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-compute
      Description: Tagged public-beta ECS, ECR, scaling, logs and private service discovery lifecycle.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateOnlyTaggedComputeResources
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecs:CreateCapacityProvider
              - ecs:CreateCluster
              - ecs:CreateService
              - ecs:RegisterTaskDefinition
              - logs:CreateLogGroup
            Resource:
              - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/jsc-public-beta/*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:capacity-provider/jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/jsc-public-beta
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/jsc-public-beta/*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/jsc-public-beta-*:*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/jsc/public-beta/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: TagEcsResourcesOnlyDuringCreate
            Effect: Allow
            Action: ecs:TagResource
            Resource:
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:capacity-provider/jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/jsc-public-beta
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/jsc-public-beta/*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/jsc-public-beta-*:*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                ecs:CreateAction:
                  - CreateCapacityProvider
                  - CreateCluster
                  - CreateService
                  - RegisterTaskDefinition
          - Sid: TagEcrRepositoriesOnlyDuringCreate
            Effect: Allow
            Action: ecr:TagResource
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/jsc-public-beta/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: TagLogGroupsOnlyDuringCreate
            Effect: Allow
            Action: logs:TagResource
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/jsc/public-beta/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: ManageOnlyTaggedAutoScalingGroups
            Effect: Allow
            Action:
              - autoscaling:DeleteAutoScalingGroup
              - autoscaling:PutLifecycleHook
              - autoscaling:ResumeProcesses
              - autoscaling:SetDesiredCapacity
              - autoscaling:StartInstanceRefresh
              - autoscaling:SuspendProcesses
              - autoscaling:TerminateInstanceInAutoScalingGroup
            Resource: !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/jsc-public-beta-ecs-*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: UpdateOnlyBoundedTaggedAutoScalingGroup
            Effect: Allow
            Action: autoscaling:UpdateAutoScalingGroup
            Resource: !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/jsc-public-beta-ecs-*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
              Bool:
                autoscaling:LaunchTemplateVersionSpecified: 'true'
              NumericLessThanEqualsIfExists:
                autoscaling:MaxSize: 1
              NumericGreaterThanEqualsIfExists:
                autoscaling:MinSize: 1
          - Sid: UpdateTagsOnlyOnTaggedPublicBetaAutoScalingGroups
            Effect: Allow
            Action: autoscaling:CreateOrUpdateTags
            Resource: !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/jsc-public-beta-ecs-*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: ManageOnlyTaggedComputeResources
            Effect: Allow
            Action:
              - ecr:DeleteLifecyclePolicy
              - ecr:DeleteRepository
              - ecr:PutLifecyclePolicy
              - ecr:SetRepositoryPolicy
              - ecs:DeleteCapacityProvider
              - ecs:DeleteCluster
              - ecs:DeleteService
              - ecs:DeregisterTaskDefinition
              - ecs:PutClusterCapacityProviders
              - ecs:UpdateCapacityProvider
              - ecs:UpdateCluster
              - ecs:UpdateClusterSettings
              - ecs:UpdateService
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
            Resource:
              - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/jsc-public-beta/*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:capacity-provider/jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/jsc-public-beta
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/jsc-public-beta/*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/jsc-public-beta-*:*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/jsc/public-beta/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: CreateOnlyTaggedServiceDiscovery
            Effect: Allow
            Action:
              - servicediscovery:CreatePrivateDnsNamespace
              - servicediscovery:CreateService
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          # AWS Cloud Map performs its Route 53 prerequisite authorization at
          # the CreatePrivateDnsNamespace boundary without forwarding the
          # route53:VPCs context key. Keep this as the one documented Route 53
          # create permission required by that tagged namespace operation.
          - Sid: CreateHostedZoneRequiredByPrivateDnsNamespace
            Effect: Allow
            Action: route53:CreateHostedZone
            Resource: '*'
          - Sid: ReadHostedZoneRequiredByPrivateDnsNamespace
            Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ListHostedZonesByName
            Resource: '*'
          - Sid: TagServiceDiscoveryOnlyWithReviewedCreateTags
            Effect: Allow
            Action: servicediscovery:TagResource
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
                  - Repository
                  - CostCentre
                  - Service
          - Sid: RequiredEcsAccountSetting
            Effect: Allow
            Action: ecs:PutAccountSettingDefault
            Resource: '*'
            Condition:
              StringEquals:
                ecs:account-setting: awsvpcTrunking

  ApplyComputeLaunchPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-compute-launch
      Description: Launch only the reviewed ECS AMI through the tagged public-beta launch template.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RunOnlyReviewedEcsAmiFromLaunchTemplate
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::image/${EcsAmiId}
            Condition:
              ArnLike:
                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
              Bool:
                ec2:IsLaunchTemplateResource: 'true'
          - Sid: RunOnlyFromTaggedPublicBetaTemplateResources
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
            Condition:
              StringEquals:
                ec2:ResourceTag/Application: Job Seeker Copilot
                ec2:ResourceTag/Environment: public-beta
                ec2:ResourceTag/ManagedBy: Terraform
              ArnLike:
                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
              Bool:
                ec2:IsLaunchTemplateResource: 'true'
          - Sid: RunOnlyInTaggedPublicBetaSubnets
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
            Condition:
              StringEquals:
                ec2:ResourceTag/Application: Job Seeker Copilot
                ec2:ResourceTag/Environment: public-beta
                ec2:ResourceTag/ManagedBy: Terraform
              ArnLike:
                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
          - Sid: CreateOnlyTaggedPublicBetaInstances
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                ec2:InstanceType: m7i.2xlarge
                ec2:MetadataHttpTokens: required
              Bool:
                ec2:IsLaunchTemplateResource: 'true'
              ArnLike:
                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
          - Sid: CreateOnlyPrivateNetworkInterfacesFromReviewedTemplate
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            Condition:
              # Auto Scaling's RunInstances authorization creates the ENI
              # outside the launch template and omits create-tag/public-IP
              # context keys unless the caller explicitly supplies them.
              StringEqualsIfExists:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
              BoolIfExists:
                ec2:AssociatePublicIpAddress: 'false'
              ArnLike:
                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
                ec2:Subnet: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                ec2:Vpc: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
          - Sid: CreateOnlyTaggedEncryptedGp3Volumes
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                ec2:VolumeType: gp3
              Bool:
                ec2:Encrypted: 'true'
                ec2:IsLaunchTemplateResource: 'true'
              ArnLike:
                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
          - Sid: TagOnlyInstanceResourcesDuringRunInstances
            Effect: Allow
            Action: ec2:CreateTags
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                ec2:CreateAction: RunInstances
          - Sid: CreateAndTagExactEcsInstanceProfile
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:TagInstanceProfile
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/jsc-public-beta-ecs
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: ManageOnlyTaggedExactEcsInstanceProfile
            Effect: Allow
            Action:
              - iam:AddRoleToInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/jsc-public-beta-ecs
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform

  ApplyDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-data
      Description: Tagged public-beta KMS, RDS, secrets, backup and notification lifecycle.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateOnlyTaggedDataResources
            Effect: Allow
            Action:
              - rds:CreateDBParameterGroup
              - rds:CreateDBSubnetGroup
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:jsc-public-beta-postgres15-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:jsc-public-beta-postgres
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: CreateOnlyReviewedPublicBetaDatabase
            Effect: Allow
            Action: rds:CreateDBInstance
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-postgres
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                rds:DatabaseClass: db.t4g.medium
                rds:DatabaseEngine: postgres
              Bool:
                rds:ManageMasterUserPassword: 'true'
                rds:MultiAz: 'false'
                rds:PubliclyAccessible: 'false'
                rds:StorageEncrypted: 'true'
              NumericLessThanEquals:
                rds:StorageSize: 50
          - Sid: UseOnlyTaggedPublicBetaDatabaseParentsDuringCreate
            Effect: Allow
            Action: rds:CreateDBInstance
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:jsc-public-beta-postgres15-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:jsc-public-beta-postgres
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: CreateOnlyNamedTerraformSecrets
            Effect: Allow
            Action: secretsmanager:CreateSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:jsc-public-beta/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
                secretsmanager:KmsKeyArn: !GetAtt ApplicationDataKey.Arn
          - Sid: TagRdsResourcesOnlyDuringCreate
            Effect: Allow
            Action: rds:AddTagsToResource
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:jsc-public-beta-*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: TagTerraformSecretsOnlyDuringCreate
            Effect: Allow
            Action: secretsmanager:TagResource
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:jsc-public-beta/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: PermitRdsManagedMasterSecretCreation
            Effect: Allow
            Action: secretsmanager:CreateSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*
            Condition:
              StringEquals:
                secretsmanager:KmsKeyArn: !GetAtt ApplicationDataKey.Arn
          - Sid: TagOnlyRdsOwnedMasterSecret
            Effect: Allow
            Action: secretsmanager:TagResource
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*
          - Sid: RotateOnlyPublicBetaRdsManagedMasterSecret
            Effect: Allow
            Action: secretsmanager:RotateSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*
            Condition:
              StringEquals:
                'secretsmanager:ResourceTag/aws:secretsmanager:owningService': rds
              StringLike:
                'secretsmanager:ResourceTag/aws:rds:primaryDBInstanceArn': !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-postgres
          - Sid: UseExactFoundationDataKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: !GetAtt ApplicationDataKey.Arn
          - Sid: GrantExactFoundationDataKeyToAwsResources
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !GetAtt ApplicationDataKey.Arn
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'
          - Sid: ManageOnlyTaggedDataResources
            Effect: Allow
            Action:
              - rds:DeleteDBParameterGroup
              - rds:DeleteDBSubnetGroup
              - rds:ModifyDBParameterGroup
              - rds:ModifyDBSubnetGroup
              - rds:ResetDBParameterGroup
              - secretsmanager:DeleteResourcePolicy
              - secretsmanager:DeleteSecret
              - secretsmanager:PutResourcePolicy
              - secretsmanager:UpdateSecret
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:jsc-public-beta-*
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:jsc-public-beta/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: ModifyOnlyReviewedPublicBetaDatabase
            Effect: Allow
            Action: rds:ModifyDBInstance
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:jsc-public-beta-postgres
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
              StringEqualsIfExists:
                rds:DatabaseClass: db.t4g.medium
                rds:DatabaseEngine: postgres
              BoolIfExists:
                rds:ManageMasterUserPassword: 'true'
                rds:MultiAz: 'false'
                rds:PubliclyAccessible: 'false'
                rds:StorageEncrypted: 'true'
              NumericLessThanEqualsIfExists:
                rds:StorageSize: 50
          - Sid: ManageSelectionOnExactFoundationBackupPlan
            Effect: Allow
            Action:
              - backup:CreateBackupSelection
              - backup:DeleteBackupSelection
            Resource: !GetAtt CustomerDataBackupPlan.BackupPlanArn
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: CloudFormation-bootstrap

  ApplyObservabilityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-observability
      Description: Named and tagged public-beta alarms, dashboards and WAF lifecycle; billing controls stay in the manual foundation.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateOnlyTaggedObservabilityResources
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - wafv2:CreateRegexPatternSet
              - wafv2:CreateWebACL
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: ReferenceOnlyAwsManagedWafRuleSets
            Effect: Allow
            Action:
              - wafv2:CreateWebACL
              - wafv2:UpdateWebACL
            Resource: !Sub arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/managedruleset/*/*
          - Sid: TagOnlyNamedPublicBetaAlarms
            Effect: Allow
            Action: cloudwatch:TagResource
            Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:jsc-public-beta-*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: TagOnlyNamedPublicBetaWafResources
            Effect: Allow
            Action: wafv2:TagResource
            Resource:
              - !Sub arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/regexpatternset/jsc-public-beta-*/*
              - !Sub arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/jsc-public-beta-*/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: ManageOnlyTaggedBudgetsAndAlarms
            Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:PutMetricAlarm
            Resource:
              - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:jsc-public-beta-*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: ExactPublicBetaDashboards
            Effect: Allow
            Action:
              - cloudwatch:DeleteDashboards
              - cloudwatch:PutDashboard
            Resource: !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/jsc-public-beta-*
          - Sid: ManageOnlyTaggedWafResources
            Effect: Allow
            Action:
              - wafv2:AssociateWebACL
              - wafv2:CreateWebACL
              - wafv2:DeleteRegexPatternSet
              - wafv2:DeleteWebACL
              - wafv2:DisassociateWebACL
              - wafv2:UpdateRegexPatternSet
              - wafv2:UpdateWebACL
            Resource:
              - !Sub arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/regexpatternset/jsc-public-beta-*/*
              - !Sub arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/jsc-public-beta-*/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: AssociateWafOnlyWithTaggedPublicBetaAlb
            Effect: Allow
            Action:
              - elasticloadbalancing:CreateWebACLAssociation
              - elasticloadbalancing:DeleteWebACLAssociation
              - elasticloadbalancing:GetLoadBalancerWebACL
            Resource: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/jsc-public-beta-*/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform

  ApplyReleaseOperationsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-release-operations
      Description: Exact protected release-marker, secret-seeding and one-shot operator calls.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReconcileOnlyDeclaredPublicBetaSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:PutSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:jsc-public-beta/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: WriteOnlyExactReleaseMarkers
            Effect: Allow
            Action:
              - ssm:AddTagsToResource
              - ssm:GetParameter
              - ssm:PutParameter
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jsc/public-beta/release/database-bootstrap
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jsc/public-beta/release/preflight
          - Sid: RunOnlyReviewedReleaseOperatorTasks
            Effect: Allow
            Action: ecs:RunTask
            Resource:
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/jsc-public-beta-database-bootstrap:*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/jsc-public-beta-migration-verification:*
              - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/jsc-public-beta-release-preflight:*
            Condition:
              ArnEquals:
                ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/jsc-public-beta
          - Sid: PassOnlyEcsInstanceRoleToEc2
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
            Condition:
              StringEquals:
                iam:PassedToService: ec2.amazonaws.com
          - Sid: PassOnlyMonitoringRoleToRdsMonitoring
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
            Condition:
              StringEquals:
                iam:PassedToService: rds.amazonaws.com
          - Sid: PassOnlyFlowRoleToVpcFlowLogs
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-vpc-flow
            Condition:
              StringEquals:
                iam:PassedToService: vpc-flow-logs.amazonaws.com
          - Sid: PassOnlyBackupRolesToBackup
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
            Condition:
              StringEquals:
                iam:PassedToService: backup.amazonaws.com
          - Sid: PassOnlyTaskRolesToEcsTasks
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-release-operator-role
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-task
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Sid: AttachOnlyEcsInstancePolicies
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
          - Sid: AttachOnlyRdsMonitoringPolicy
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
                iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
          - Sid: AttachOnlyBackupPolicies
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref BackupWorkloadBoundary
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBackupServiceRolePolicyForS3Backup
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
          - Sid: AttachOnlyBackupRestorePolicies
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref BackupRestoreWorkloadBoundary
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBackupServiceRolePolicyForS3Restore
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
          - Sid: AttachOnlyExecutionRolePolicy
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
                iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
          - Sid: RequiredServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - autoscaling.amazonaws.com
                  - ecs.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - rds.amazonaws.com

  ApplyIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-iam
      Description: Exact workload-role lifecycle, bounded by the immutable public-beta permissions boundary.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateCommonBoundaryConstrainedRoles
            Effect: Allow
            Action: iam:CreateRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-vpc-flow
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-release-operator-role
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-task
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: CreateBackupBoundaryConstrainedRole
            Effect: Allow
            Action: iam:CreateRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref BackupWorkloadBoundary
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: CreateBackupRestoreBoundaryConstrainedRole
            Effect: Allow
            Action: iam:CreateRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref BackupRestoreWorkloadBoundary
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
          - Sid: ManageOnlyCommonBoundaryConstrainedRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRoleDescription
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-vpc-flow
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-release-operator-role
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-task
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: ManageOnlyBackupBoundaryConstrainedRole
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRoleDescription
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref BackupWorkloadBoundary
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: ManageOnlyRestoreBoundaryConstrainedRole
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRoleDescription
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref BackupRestoreWorkloadBoundary
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
  ApplyTagAndStateGuardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jsc-public-beta-apply-guard
      Description: Exact ASG creation plus protected workload-role tagging and boundary repair.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateOnlyExactTaggedAutoScalingGroup
            Effect: Allow
            Action: autoscaling:CreateAutoScalingGroup
            Resource: !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/jsc-public-beta-ecs-*
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
              Bool:
                autoscaling:LaunchTemplateVersionSpecified: 'true'
              NumericEquals:
                autoscaling:MaxSize: 1
                autoscaling:MinSize: 1
          - Sid: TagOnlyExactReservedWorkloadRoles
            Effect: Allow
            Action: iam:TagRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-vpc-flow
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-release-operator-role
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-task
            Condition:
              StringEquals:
                aws:RequestTag/Application: Job Seeker Copilot
                aws:RequestTag/Environment: public-beta
                aws:RequestTag/ManagedBy: Terraform
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
                  - Repository
                  - CostCentre
                  - Name
          - Sid: RepairOnlyCommonWorkloadBoundaries
            Effect: Allow
            Action: iam:PutRolePermissionsBoundary
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-vpc-flow
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-release-operator-role
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-task
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: RepairOnlyBackupWorkloadBoundary
            Effect: Allow
            Action: iam:PutRolePermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref BackupWorkloadBoundary
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform
          - Sid: RepairOnlyRestoreWorkloadBoundary
            Effect: Allow
            Action: iam:PutRolePermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref BackupRestoreWorkloadBoundary
                aws:ResourceTag/Application: Job Seeker Copilot
                aws:ResourceTag/Environment: public-beta
                aws:ResourceTag/ManagedBy: Terraform

  ApplyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jsc-public-beta-github-apply
      MaxSessionDuration: 10800
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganisation}@${GitHubOrganisationId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${ApplyEnvironmentName}
      ManagedPolicyArns:
        - !Ref ApplyDiscoveryPolicy
        - !Ref ApplyEc2NetworkPolicy
        - !Ref ApplyNetworkEdgePolicy
        - !Ref ApplyComputePolicy
        - !Ref ApplyComputeLaunchPolicy
        - !Ref ApplyDataPolicy
        - !Ref ApplyObservabilityPolicy
        - !Ref ApplyReleaseOperationsPolicy
        - !Ref ApplyIamPolicy
        - !Ref ApplyTagAndStateGuardPolicy
      Policies:
        - PolicyName: TerraformState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StateBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
              - Sid: ExactStateObjectReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${StateBucket.Arn}/public-beta/terraform.tfstate'
              - Sid: ExactStateLockLifecycle
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${StateBucket.Arn}/public-beta/terraform.tfstate.tflock'
              - Sid: ExactStateKeyUse
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt StateKey.Arn
        - PolicyName: NonRemovableApplyGuardrails
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyBootstrapStateControlPlaneMutation
                Effect: Deny
                Action:
                  - kms:DisableKey
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketLogging
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource:
                  - !GetAtt StateKey.Arn
                  - !GetAtt StateBucket.Arn
              - Sid: DenyWorkloadBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-ecs-instance
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-rds-monitoring
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-vpc-flow
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-backup-restore
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-release-operator-role
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-execution
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/jsc-public-beta-*-task
              - Sid: DenyProtectedTagRemoval
                Effect: Deny
                Action:
                  - autoscaling:DeleteTags
                  - backup:UntagResource
                  - budgets:UntagResource
                  - ce:UntagResource
                  - cloudwatch:UntagResource
                  - ec2:DeleteTags
                  - ecr:UntagResource
                  - ecs:UntagResource
                  - elasticloadbalancing:RemoveTags
                  - iam:UntagInstanceProfile
                  - iam:UntagRole
                  - kms:UntagResource
                  - logs:UntagResource
                  - rds:RemoveTagsFromResource
                  - secretsmanager:UntagResource
                  - servicediscovery:UntagResource
                  - sns:UntagResource
                  - wafv2:UntagResource
                Resource: '*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:TagKeys:
                      - Application
                      - Environment
                      - ManagedBy
              - Sid: DenyWrongApplicationTag
                Effect: Deny
                Action:
                  - autoscaling:CreateOrUpdateTags
                  - backup:TagResource
                  - budgets:TagResource
                  - ce:TagResource
                  - cloudwatch:TagResource
                  - ec2:CreateTags
                  - ecr:TagResource
                  - ecs:TagResource
                  - elasticloadbalancing:AddTags
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - kms:TagResource
                  - logs:TagResource
                  - rds:AddTagsToResource
                  - secretsmanager:TagResource
                  - servicediscovery:TagResource
                  - sns:TagResource
                  - wafv2:TagResource
                Resource: '*'
                Condition:
                  'Null':
                    aws:RequestTag/Application: 'false'
                  StringNotEquals:
                    aws:RequestTag/Application: Job Seeker Copilot
              - Sid: DenyWrongEnvironmentTag
                Effect: Deny
                Action:
                  - autoscaling:CreateOrUpdateTags
                  - backup:TagResource
                  - budgets:TagResource
                  - ce:TagResource
                  - cloudwatch:TagResource
                  - ec2:CreateTags
                  - ecr:TagResource
                  - ecs:TagResource
                  - elasticloadbalancing:AddTags
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - kms:TagResource
                  - logs:TagResource
                  - rds:AddTagsToResource
                  - secretsmanager:TagResource
                  - servicediscovery:TagResource
                  - sns:TagResource
                  - wafv2:TagResource
                Resource: '*'
                Condition:
                  'Null':
                    aws:RequestTag/Environment: 'false'
                  StringNotEquals:
                    aws:RequestTag/Environment: public-beta
              - Sid: DenyWrongManagedByTag
                Effect: Deny
                Action:
                  - autoscaling:CreateOrUpdateTags
                  - backup:TagResource
                  - budgets:TagResource
                  - ce:TagResource
                  - cloudwatch:TagResource
                  - ec2:CreateTags
                  - ecr:TagResource
                  - ecs:TagResource
                  - elasticloadbalancing:AddTags
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - kms:TagResource
                  - logs:TagResource
                  - rds:AddTagsToResource
                  - secretsmanager:TagResource
                  - servicediscovery:TagResource
                  - sns:TagResource
                  - wafv2:TagResource
                Resource: '*'
                Condition:
                  'Null':
                    aws:RequestTag/ManagedBy: 'false'
                  StringNotEquals:
                    aws:RequestTag/ManagedBy: Terraform

