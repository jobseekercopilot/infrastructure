services:
  job-service:
    environment:
      JOB_SEARCH_REQUEST_TIMEOUT_MS: "20000"
      JOB_SEARCH_PROVIDER_TIMEOUT_MS: "15000"
      JOB_SEARCH_MATCHING_TIMEOUT_MS: "3000"
      # The first cursor page returns current JSearch vacancies; a second page
      # is too slow for an interactive multi-provider request on RapidAPI.
      JSEARCH_MAX_CURSOR_PAGES: "1"

  job-finder-gateway:
    environment:
      JOB_FINDER_RESPONSE_TIMEOUT_MS: "23000"
      JOB_FINDER_REQUEST_DEADLINE_MS: "23000"

  reed-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: LIVE
      REED_ENABLED: "true"
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: reed_api_key
        target: REED_API_KEY
    networks:
      - job-seeker-network
      - provider-egress-network

  adzuna-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: LIVE
      ADZUNA_ENABLED: "true"
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: adzuna_app_id
        target: ADZUNA_APP_ID
      - source: adzuna_app_key
        target: ADZUNA_APP_KEY
    networks:
      - job-seeker-network
      - provider-egress-network

  jsearch-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: LIVE
      JSEARCH_ENABLED: "true"
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: jsearch_api_key
        target: JSEARCH_API_KEY
    networks:
      - job-seeker-network
      - provider-egress-network

  nhs-jobs-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: LIVE
      NHS_JOBS_ENABLED: "true"
      NHS_JOBS_RESULTS_PER_PAGE: ${NHS_JOBS_RESULTS_PER_PAGE:-50}
    networks:
      - job-seeker-network
      - provider-egress-network

  apprenticeships-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: LIVE
      APPRENTICESHIPS_ENABLED: "true"
      APPRENTICESHIPS_SYNC_PAGE_SIZE: ${APPRENTICESHIPS_SYNC_PAGE_SIZE:-100}
      APPRENTICESHIPS_SYNC_MAX_PAGES: ${APPRENTICESHIPS_SYNC_MAX_PAGES:-150}
      APPRENTICESHIPS_INITIAL_SYNC_DELAY_MS: ${APPRENTICESHIPS_INITIAL_SYNC_DELAY_MS:-1000}
      APPRENTICESHIPS_SYNC_DELAY_MS: ${APPRENTICESHIPS_SYNC_DELAY_MS:-900000}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: apprenticeships_api_key
        target: APPRENTICESHIPS_API_KEY
    networks:
      - job-seeker-network
      - provider-egress-network

  llm-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: FIXTURE

  stripe-gateway:
    environment:
      EXTERNAL_PROVIDER_MODE: FIXTURE

  job-seeker-copilot-client:
    environment:
      JOB_SEARCH_PROVIDER_MODE: REAL_PROVIDERS
      BFF_DOWNSTREAM_TIMEOUT_MS: "25000"

networks:
  provider-egress-network:
    driver: bridge
    internal: false

secrets:
  reed_api_key:
    environment: REED_API_KEY
  adzuna_app_id:
    environment: ADZUNA_APP_ID
  adzuna_app_key:
    environment: ADZUNA_APP_KEY
  jsearch_api_key:
    environment: JSEARCH_API_KEY
  apprenticeships_api_key:
    environment: APPRENTICESHIPS_API_KEY
