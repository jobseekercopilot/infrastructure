      llm-gateway:
        condition: service_healthy
      document-store-service:
        condition: service_healthy
      application-tracker-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  document-generation-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=document_generation
      - POSTGRES_USER=document_generation
      - POSTGRES_PASSWORD=${DOCUMENT_GENERATION_DATABASE_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - document-generation-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_generation -d document_generation"]
      interval: 5s
      timeout: 5s
      retries: 12

  document-generation-gateway:
    build:
      context: ../.cache/runtime-images/document-generation-gateway
      dockerfile: ../../../infrastructure/docker/document-generation-gateway.runtime.Dockerfile
    ports:
      - "8092:8092"
    environment:
      - SERVER_PORT=8092
      - AUTH_JWKS_URI=http://authentication-service:8084/.well-known/jwks.json
      - DOCUMENT_GENERATION_JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - DOCUMENT_GENERATION_JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
      - AUTH_SERVICE_TOKEN=${AUTH_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - APPLICATION_TRACKER_PRODUCER_TOKEN=${APPLICATION_TRACKER_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - CV_COVER_LETTER_GATEWAY_TOKEN=${CV_COVER_LETTER_GATEWAY_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_EXPORT_GATEWAY_TOKEN=${DOCUMENT_EXPORT_GATEWAY_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_PRODUCER_TOKEN=${DOCUMENT_STORE_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_READER_TOKEN=${DOCUMENT_STORE_READER_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_GENERATION_GATEWAY_TO_PAYMENT_SERVICE_TOKEN=${DOCUMENT_GENERATION_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_GENERATION_DATABASE_URL=jdbc:postgresql://document-generation-postgres:5432/document_generation
      - DOCUMENT_GENERATION_DATABASE_USERNAME=document_generation
      - DOCUMENT_GENERATION_DATABASE_PASSWORD=${DOCUMENT_GENERATION_DATABASE_PASSWORD:?Generate the selected untracked environment file}
      - AUTHENTICATION_SERVICE_URL=http://authentication-service:8084
      - USER_PROFILE_SERVICE_URL=http://user-profile-service:8085
      - JOB_SERVICE_URL=http://job-service:8086
      - CV_COVER_LETTER_SERVICE_URL=http://cv-cover-letter-service:8091
      - DOCUMENT_EXPORT_SERVICE_URL=http://document-export-service:8094
      - DOCUMENT_STORE_SERVICE_URL=http://document-store-service:8089
      - APPLICATION_TRACKER_SERVICE_URL=http://application-tracker-service:8088
    depends_on:
      document-generation-postgres:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      user-profile-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      cv-cover-letter-service:
        condition: service_healthy
      document-export-service:
        condition: service_healthy
      document-store-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  reporting-service:
    build:
      context: ../reporting-service
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    environment:
      - SERVER_PORT=8096
      - APPLICATION_TRACKER_SERVICE_BASE_URL=http://application-tracker-service:8088
      - USER_PROFILE_SERVICE_URL=http://user-profile-service:8085
      - REPORTING_GATEWAY_SERVICE_TOKEN=${REPORTING_GATEWAY_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - APPLICATION_TRACKER_READER_TOKEN=${APPLICATION_TRACKER_READER_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      application-tracker-service:
        condition: service_healthy
      user-profile-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8096/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  reporting-gateway:
    build:
      context: ../reporting-gateway
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - SERVER_PORT=8095
      - REPORTING_SERVICE_URL=http://reporting-service:8096
      - AUTH_JWKS_URI=http://authentication-service:8084/.well-known/jwks.json
      - REPORTING_GATEWAY_JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - REPORTING_GATEWAY_JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
      - REPORTING_GATEWAY_SERVICE_TOKEN=${REPORTING_GATEWAY_SERVICE_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      authentication-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8095/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payment-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=payment
      - POSTGRES_USER=payment
      - POSTGRES_PASSWORD=${PAYMENT_DATABASE_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 12

  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      - SERVER_PORT=8099
      - ENVIRONMENT_DATA_ENABLED=false
      - PAYMENT_DATABASE_URL=jdbc:postgresql://payment-postgres:5432/payment
      - PAYMENT_DATABASE_USERNAME=payment
      - PAYMENT_DATABASE_PASSWORD=${PAYMENT_DATABASE_PASSWORD:?Generate the selected untracked environment file}
      - PAYMENT_DATABASE_PRODUCTION_SAFETY_CHECK=false
      - PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN=${PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN=${CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_GENERATION_GATEWAY_TO_PAYMENT_SERVICE_TOKEN=${DOCUMENT_GENERATION_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - STRIPE_GATEWAY_TO_PAYMENT_SERVICE_TOKEN=${STRIPE_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      payment-postgres:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8099/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  stripe-gateway:
    build:
      context: ../stripe-gateway
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - SERVER_PORT=8100
      - SPRING_PROFILES_ACTIVE=local
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.0.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3000/payment/success}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3000/payment/cancel}
      - PAYMENT_SERVICE_URL=http://payment-service:8099
      - PAYMENT_GATEWAY_TO_STRIPE_GATEWAY_TOKEN=${PAYMENT_GATEWAY_TO_STRIPE_GATEWAY_TOKEN:?Generate the selected untracked environment file}
      - STRIPE_GATEWAY_TO_PAYMENT_SERVICE_TOKEN=${STRIPE_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8100/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payment-gateway:
    build:
      context: ../payment-gateway
      dockerfile: Dockerfile
    ports:
      - "8098:8098"
    environment:
      - SERVER_PORT=8098
      - PAYMENT_SERVICE_URL=http://payment-service:8099
      - STRIPE_GATEWAY_URL=http://stripe-gateway:8100
      - BFF_TO_PAYMENT_GATEWAY_TOKEN=${BFF_TO_PAYMENT_GATEWAY_TOKEN:?Generate the selected untracked environment file}
      - PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN=${PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - PAYMENT_GATEWAY_TO_STRIPE_GATEWAY_TOKEN=${PAYMENT_GATEWAY_TO_STRIPE_GATEWAY_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      payment-service:
        condition: service_healthy
      stripe-gateway:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8098/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  job-seeker-copilot-client:
    build:
      context: ../job-seeker-copilot-client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - LOCATION_GATEWAY_URL=http://location-gateway:8081
      - USER_MANAGEMENT_GATEWAY_URL=http://user-management-gateway:8083
      - JOB_FINDER_GATEWAY_URL=http://job-finder-gateway:8080
      - DOCUMENT_GENERATION_GATEWAY_URL=http://document-generation-gateway:8092
      - DOCUMENT_STORE_SERVICE_URL=http://document-store-service:8089
      - REPORTING_GATEWAY_URL=http://reporting-gateway:8095
      - PAYMENT_GATEWAY_URL=http://payment-gateway:8098
      - BFF_TO_PAYMENT_GATEWAY_TOKEN=${BFF_TO_PAYMENT_GATEWAY_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      location-gateway:
        condition: service_healthy
      user-management-gateway:
        condition: service_healthy
      job-finder-gateway:
        condition: service_healthy
      document-generation-gateway:
        condition: service_healthy
      reporting-gateway:
        condition: service_healthy
      payment-gateway:
        condition: service_healthy
    networks:
      - job-seeker-network
      - host-access
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  job-seeker-network:
    driver: bridge
    internal: true
  host-access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  portainer-data:
  authentication-postgres-data:
  user-profile-postgres-data:
  job-service-postgres-data:
  document-generation-postgres-data:
  document-store-postgres-data:
  document-store-objects:
  application-tracker-postgres-data:
  payment-postgres-data:
