services:
  portainer:
    image: portainer/portainer-ce:2.39.5
    profiles: ["operator-tools"]
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dozzle:
    image: amir20/dozzle:v10.6.12
    profiles: ["operator-tools"]
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postcode-io-gateway:
    build:
      context: ../postcode-io-gateway
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=postcode-io-gateway
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=local
      - DEPLOYMENT_ENVIRONMENT_CLASS=LOCAL
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.0.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  location-gateway:
    build:
      context: ../location-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=location-gateway
      - SERVER_PORT=8081
      - POSTCODE_IO_GATEWAY_URL=http://postcode-io-gateway:8082
    depends_on:
      postcode-io-gateway:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  authentication-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=authentication
      - POSTGRES_USER=authentication
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - authentication-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentication -d authentication"]
      interval: 5s
      timeout: 5s
      retries: 12

  authentication-service:
    build:
      context: ../authentication-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SPRING_APPLICATION_NAME=authentication-service
      - SERVER_PORT=8084
      - ENVIRONMENT_DATA_ENABLED=false
      - AUTH_DB_URL=jdbc:postgresql://authentication-postgres:5432/authentication
      - AUTH_DB_USERNAME=authentication
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:?Generate the selected untracked environment file}
      - JWT_PRIVATE_KEY_BASE64=${JWT_PRIVATE_KEY_BASE64:?Generate the selected untracked environment file}
      - JWT_PUBLIC_KEY_BASE64=${JWT_PUBLIC_KEY_BASE64:?Generate the selected untracked environment file}
      - JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
      - JWT_KEY_ID=local-generated
      - AUTH_SERVICE_TOKEN=${AUTH_SERVICE_TOKEN:?Generate the selected untracked environment file}
      - AUTH_ENVIRONMENT_DATA_TOKEN=${ENVIRONMENT_DATA_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      authentication-postgres:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-profile-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=user_profile
      - POSTGRES_USER=user_profile
      - POSTGRES_PASSWORD=${USER_PROFILE_DATABASE_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - user-profile-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_profile -d user_profile"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-profile-service:
    build:
      context: ../user-profile-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SPRING_APPLICATION_NAME=user-profile-service
      - SERVER_PORT=8085
      - ENVIRONMENT_DATA_ENABLED=false
      - PROFILE_DB_URL=jdbc:postgresql://user-profile-postgres:5432/user_profile
      - PROFILE_DB_USERNAME=user_profile
      - PROFILE_DB_PASSWORD=${USER_PROFILE_DATABASE_PASSWORD:?Generate the selected untracked environment file}
      - AUTH_JWKS_URI=http://authentication-service:8084/.well-known/jwks.json
      - PROFILE_JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - PROFILE_JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
    depends_on:
      authentication-service:
        condition: service_healthy
      user-profile-postgres:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-management-gateway:
    build:
      context: ../user-management-gateway
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_APPLICATION_NAME: "user-management-gateway"
      SERVER_PORT: "8083"
      AUTHENTICATION_SERVICE_URL: "http://authentication-service:8084"
      AUTHENTICATION_SERVICE_TOKEN: "${AUTH_SERVICE_TOKEN:?Generate the selected untracked environment file}"
      USER_PROFILE_SERVICE_URL: "http://user-profile-service:8085"
    depends_on:
      authentication-service:
        condition: service_healthy
      user-profile-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  reed-gateway:
    build:
      context: ../.cache/runtime-images/reed-gateway
      dockerfile: ../../../infrastructure/docker/reed-gateway.runtime.Dockerfile
    ports:
      - "8087:8087"
    environment:
      - SPRING_APPLICATION_NAME=reed-gateway
      - SERVER_PORT=8087
      - SPRING_PROFILES_ACTIVE=local
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.0.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  adzuna-gateway:
    build:
      context: ../.cache/runtime-images/adzuna-gateway
      dockerfile: ../../../infrastructure/docker/adzuna-gateway.runtime.Dockerfile
    ports:
      - "8101:8101"
    environment:
      - SPRING_APPLICATION_NAME=adzuna-gateway
      - SERVER_PORT=8101
      - SPRING_PROFILES_ACTIVE=local
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.0.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
      - ADZUNA_ENABLED=${ADZUNA_ENABLED:-true}
      - ADZUNA_RESULTS_PER_PAGE=${ADZUNA_RESULTS_PER_PAGE:-50}
      - ADZUNA_PAGES_PER_SEARCH=${ADZUNA_PAGES_PER_SEARCH:-1}
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8101/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jsearch-gateway:
    build:
      context: ../.cache/runtime-images/jsearch-gateway
      dockerfile: ../../../infrastructure/docker/jsearch-gateway.runtime.Dockerfile
    ports:
      - "8102:8102"
    environment:
      - SPRING_APPLICATION_NAME=jsearch-gateway
      - SERVER_PORT=8102
      - SPRING_PROFILES_ACTIVE=local
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.0.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
      - JSEARCH_ENABLED=${JSEARCH_ENABLED:-true}
      - JSEARCH_COUNTRY=${JSEARCH_COUNTRY:-gb}
      - JSEARCH_LANGUAGE=${JSEARCH_LANGUAGE:-en}
      - JSEARCH_PAGES_PER_SEARCH=${JSEARCH_PAGES_PER_SEARCH:-1}
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8102/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  system-data-service:
    build:
      context: ../system-data-service
      dockerfile: Dockerfile
    ports:
      - "8103:8103"
    environment:
      - SPRING_APPLICATION_NAME=system-data-service
      - SERVER_PORT=8103
      - SPRING_PROFILES_ACTIVE=local
      - SYSTEM_DATA_REPOSITORY_DIRECTORY=/app/dataset-repository
      - SYSTEM_DATA_ENVIRONMENT_MANAGEMENT_ENABLED=false
      - SYSTEM_DATA_FIXTURES_ENABLED=true
      - SYSTEM_DATA_FIXTURE_ALLOWED_PROFILES=local
      - ADZUNA_GATEWAY_URL=http://adzuna-gateway:8101
      - JSEARCH_GATEWAY_URL=http://jsearch-gateway:8102
      - REED_GATEWAY_URL=http://reed-gateway:8087
      - POSTCODE_IO_GATEWAY_URL=http://postcode-io-gateway:8082
      - LLM_GATEWAY_URL=http://llm-gateway:8090
      - AUTHENTICATION_SERVICE_URL=http://authentication-service:8084
      - USER_PROFILE_SERVICE_URL=http://user-profile-service:8085
      - APPLICATION_TRACKER_SERVICE_URL=http://application-tracker-service:8088
      - DOCUMENT_STORE_SERVICE_URL=http://document-store-service:8089
      - PAYMENT_SERVICE_URL=http://payment-service:8099
      - SYSTEM_DATA_INTERNAL_CALLER_KEY=${SYSTEM_DATA_INTERNAL_CALLER_KEY:?Generate the selected untracked environment file}
      - SYSTEM_DATA_DOWNSTREAM_ENVIRONMENT_DATA_TOKEN=${ENVIRONMENT_DATA_TOKEN:?Generate the selected untracked environment file}
    volumes:
      - ../system-data-service/fixtures/datasets:/app/dataset-repository:ro
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8103/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  job-service-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=job_service
      - POSTGRES_USER=job_service
      - POSTGRES_PASSWORD=${JOB_SERVICE_DATABASE_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - job-service-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_service -d job_service"]
      interval: 5s
      timeout: 5s
      retries: 12

  job-service:
    build:
      context: ../job-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - SPRING_APPLICATION_NAME=job-service
      - SERVER_PORT=8086
      - JOB_SERVICE_DATABASE_URL=jdbc:postgresql://job-service-postgres:5432/job_service
      - JOB_SERVICE_DATABASE_USERNAME=job_service
      - JOB_SERVICE_DATABASE_PASSWORD=${JOB_SERVICE_DATABASE_PASSWORD:?Generate the selected untracked environment file}
      - JOB_SERVICE_DATABASE_SSL_MODE=disable
      - JOB_SERVICE_DATABASE_PRODUCTION_SAFETY_CHECK=false
      - REED_GATEWAY_URL=http://reed-gateway:8087
      - ADZUNA_GATEWAY_URL=http://adzuna-gateway:8101
      - JSEARCH_GATEWAY_URL=http://jsearch-gateway:8102
      - JOB_MATCHING_SERVICE_URL=http://job-matching-service:8097
    depends_on:
      job-service-postgres:
        condition: service_healthy
      reed-gateway:
        condition: service_healthy
      adzuna-gateway:
        condition: service_healthy
      jsearch-gateway:
        condition: service_healthy
      job-matching-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  job-matching-service:
    build:
      context: ../job-matching-service
      dockerfile: Dockerfile
    ports:
      - "8097:8097"
    environment:
      - SPRING_APPLICATION_NAME=job-matching-service
      - SERVER_PORT=8097
      - APPLICATION_TRACKER_SERVICE_BASE_URL=http://application-tracker-service:8088
      - APPLICATION_TRACKER_READER_TOKEN=${APPLICATION_TRACKER_READER_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      application-tracker-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8097/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  job-finder-gateway:
    build:
      context: ../job-finder-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=job-finder-gateway
      - SERVER_PORT=8080
      - AUTH_JWKS_URI=http://authentication-service:8084/.well-known/jwks.json
      - JOB_FINDER_JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - JOB_FINDER_JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
      - JOB_SERVICE_URL=http://job-service:8086
      - USER_MANAGEMENT_GATEWAY_URL=http://user-management-gateway:8083
      - USER_PROFILE_SERVICE_URL=http://user-profile-service:8085
      - APPLICATION_TRACKER_SERVICE_URL=http://application-tracker-service:8088
      - DOCUMENT_STORE_SERVICE_URL=http://document-store-service:8089
    depends_on:
      job-service:
        condition: service_healthy
      user-management-gateway:
        condition: service_healthy
      user-profile-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  llm-gateway:
    build:
      context: ../llm-gateway
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - SERVER_PORT=8090
      - SPRING_PROFILES_ACTIVE=local
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.0.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  document-store-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=document_store
      - POSTGRES_USER=document_store
      - POSTGRES_PASSWORD=${DOCUMENT_STORE_DATABASE_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - document-store-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_store -d document_store"]
      interval: 5s
      timeout: 5s
      retries: 12

  document-store-service:
    build:
      context: ../document-store-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - SERVER_PORT=8089
      - ENVIRONMENT_DATA_ENABLED=false
      - DOCUMENT_STORE_DATABASE_URL=jdbc:postgresql://document-store-postgres:5432/document_store
      - DOCUMENT_STORE_DATABASE_USERNAME=document_store
      - DOCUMENT_STORE_DATABASE_PASSWORD=${DOCUMENT_STORE_DATABASE_PASSWORD:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_DATABASE_SSL_MODE=disable
      - DOCUMENT_STORE_OBJECT_PROVIDER=filesystem
      - DOCUMENT_STORE_FILESYSTEM_ROOT=/app/data/objects
      - DOCUMENT_STORE_ENCRYPTION_AT_REST_ENABLED=false
      - DOCUMENT_STORE_BACKUP_ENCRYPTION_ENABLED=false
      - AUTH_JWKS_URI=http://authentication-service:8084/.well-known/jwks.json
      - DOCUMENT_STORE_JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - DOCUMENT_STORE_JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
      - DOCUMENT_STORE_PRODUCER_TOKEN=${DOCUMENT_STORE_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_READER_TOKEN=${DOCUMENT_STORE_READER_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_RETENTION_ADMIN_TOKEN=${DOCUMENT_STORE_RETENTION_ADMIN_TOKEN:?Generate the selected untracked environment file}
      - ENVIRONMENT_DATA_TOKEN=${ENVIRONMENT_DATA_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_DATABASE_PRODUCTION_SAFETY_CHECK=false
    volumes:
      - document-store-objects:/app/data/objects
    depends_on:
      authentication-service:
        condition: service_healthy
      document-store-postgres:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  document-export-service:
    build:
      context: ../document-export-service
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    environment:
      - SERVER_PORT=8094
      - DOCUMENT_STORE_SERVICE_BASE_URL=http://document-store-service:8089
      - DOCUMENT_EXPORT_GATEWAY_TOKEN=${DOCUMENT_EXPORT_GATEWAY_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_PRODUCER_TOKEN=${DOCUMENT_STORE_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_READER_TOKEN=${DOCUMENT_STORE_READER_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      document-store-service:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  application-tracker-postgres:
    image: postgres:15.18-alpine
    environment:
      - POSTGRES_DB=application_tracker
      - POSTGRES_USER=application_tracker
      - POSTGRES_PASSWORD=${APPLICATION_TRACKER_DATABASE_PASSWORD:?Generate the selected untracked environment file}
    volumes:
      - application-tracker-postgres-data:/var/lib/postgresql/data
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_tracker -d application_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12

  application-tracker-service:
    build:
      context: ../application-tracker-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - SERVER_PORT=8088
      - ENVIRONMENT_DATA_ENABLED=false
      - APPLICATION_TRACKER_DATABASE_URL=jdbc:postgresql://application-tracker-postgres:5432/application_tracker
      - APPLICATION_TRACKER_DATABASE_USERNAME=application_tracker
      - APPLICATION_TRACKER_DATABASE_PASSWORD=${APPLICATION_TRACKER_DATABASE_PASSWORD:?Generate the selected untracked environment file}
      - APPLICATION_TRACKER_DATABASE_SSL_MODE=disable
      - APPLICATION_TRACKER_DATABASE_PRODUCTION_SAFETY_CHECK=false
      - APPLICATION_TRACKER_DATABASE_ENCRYPTION_AT_REST_ENABLED=false
      - APPLICATION_TRACKER_DATABASE_BACKUP_ENCRYPTION_ENABLED=false
      - AUTH_JWKS_URI=http://authentication-service:8084/.well-known/jwks.json
      - APPLICATION_TRACKER_JWT_ISSUER=${JWT_ISSUER:-job-seeker-copilot-authentication}
      - APPLICATION_TRACKER_JWT_AUDIENCE=${JWT_AUDIENCE:-job-seeker-copilot-services}
      - APPLICATION_TRACKER_PRODUCER_TOKEN=${APPLICATION_TRACKER_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - APPLICATION_TRACKER_READER_TOKEN=${APPLICATION_TRACKER_READER_TOKEN:?Generate the selected untracked environment file}
      - ENVIRONMENT_DATA_TOKEN=${ENVIRONMENT_DATA_TOKEN:?Generate the selected untracked environment file}
    depends_on:
      authentication-service:
        condition: service_healthy
      application-tracker-postgres:
        condition: service_healthy
    networks:
      - job-seeker-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cv-cover-letter-service:
    build:
      context: ../cv-cover-letter-service
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - SERVER_PORT=8091
      - LLM_GATEWAY_BASE_URL=http://llm-gateway:8090
      - DOCUMENT_STORE_SERVICE_BASE_URL=http://document-store-service:8089
      - APPLICATION_TRACKER_SERVICE_BASE_URL=http://application-tracker-service:8088
      - PAYMENT_SERVICE_BASE_URL=http://payment-service:8099
      - CV_COVER_LETTER_GATEWAY_TOKEN=${CV_COVER_LETTER_GATEWAY_TOKEN:?Generate the selected untracked environment file}
      - DOCUMENT_STORE_PRODUCER_TOKEN=${DOCUMENT_STORE_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - APPLICATION_TRACKER_PRODUCER_TOKEN=${APPLICATION_TRACKER_PRODUCER_TOKEN:?Generate the selected untracked environment file}
      - CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN=${CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN:?Generate the selected untracked environment file}
