services:
  authentication-postgres:

  portainer:
    ports: !override []

  dozzle:
    ports: !override []

  postcode-io-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - DEPLOYMENT_ENVIRONMENT_CLASS=TEST
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - PROVIDER_MODE_ENDPOINT_ENABLED=true
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}

  google-maps-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - GOOGLE_MAPS_ENABLED=false

  location-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - GOOGLE_MAPS_ENABLED=false

  location-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  authentication-service:
    ports: !override
      - "127.0.0.1:${E2E_AUTHENTICATION_SERVICE_PORT:-9104}:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=e2e,local
      - ENVIRONMENT_DATA_ENABLED=true
      - ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS=e2e
      - AUTH_ACCOUNT_EMAIL_DELIVERY_MODE=fixture
      - AUTH_ACCOUNT_EMAIL_APPLICATION_BASE_URL=http://localhost:${E2E_FRONTEND_PORT:-3100}
      - AUTH_ACCOUNT_EMAIL_FIXTURE_MAXIMUM_MESSAGES=1000
      - AUTH_LEGAL_CURRENT_VERSION=2026-08-15
      - AUTH_LEGAL_TERMS_URL=https://jobseekercopilot.com/terms
      - AUTH_LEGAL_PRIVACY_NOTICE_URL=https://jobseekercopilot.com/privacy
      - AUTH_LEGAL_DOCUMENTS_REVIEWED=true
    networks:
      - job-seeker-network
      - host-access

  user-profile-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e,environment-data
      - ENVIRONMENT_DATA_ENABLED=true
      - ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS=e2e

  user-management-gateway:
    ports: !override []
    environment:
      JAVA_TOOL_OPTIONS: ""
      SPRING_PROFILES_ACTIVE: "e2e"
      GATEWAY_AUTH_RATE_MAXIMUM: "100"

  reed-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}

  adzuna-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}

  jsearch-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}

  nhs-jobs-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - EXTERNAL_PROVIDER_MODE=FIXTURE

  apprenticeships-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - EXTERNAL_PROVIDER_MODE=FIXTURE

  system-data-service:
    ports: !override
      - "127.0.0.1:${E2E_SYSTEM_DATA_SERVICE_PORT:-9103}:8103"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SYSTEM_DATA_ENVIRONMENT_MANAGEMENT_ENABLED=true
      - SYSTEM_DATA_ENVIRONMENT_ALLOWED_PROFILES=test
      - SYSTEM_DATA_FIXTURES_ENABLED=true
      - SYSTEM_DATA_FIXTURE_ALLOWED_PROFILES=test
      - STRIPE_GATEWAY_URL=http://stripe-gateway:8100
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
    networks:
      - job-seeker-network
      - host-access

  job-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  job-matching-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  job-finder-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  llm-gateway:
    env_file: !override []
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}

  document-store-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - ENVIRONMENT_DATA_ENABLED=true
      - ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS=e2e
      - ENVIRONMENT_DATA_ISOLATED_DATABASE=true

  document-store-postgres:

  document-export-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  application-tracker-postgres:

  application-tracker-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - ENVIRONMENT_DATA_ENABLED=true
      - ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS=e2e
      - ENVIRONMENT_DATA_ISOLATED_DATABASE=true

  cv-cover-letter-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  document-generation-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  reporting-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  reporting-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  payment-service:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - ENVIRONMENT_DATA_ENABLED=true
      - ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS=e2e
      - ENVIRONMENT_DATA_ISOLATED_DATABASE=true
      - FREE_DOCUMENT_CREDITS=2
      - PAYMENT_CATALOG_VERSION=public-beta-2026-08-15
      - PAYMENT_CHECKOUT_ENABLED=true
      - PAYMENT_CHECKOUT_RELEASE_AUTHORISED=true
      - PAYMENT_PROVIDER_LIVE_MODE_EXPECTED=false
      - PAYMENT_CHECKOUT_ORDER_TTL=PT1H
      - PAYMENT_CONSUMER_TERMS_VERSION=uk-consumer-terms-2026-08-15
      - PAYMENT_TAX_STATUS=NOT_VAT_REGISTERED
      - PAYMENT_TAX_TREATMENT=VAT_NOT_CHARGED
      - PAYMENT_LEGAL_ENTITY_TYPE=SOLE_TRADER
      - PAYMENT_LEGAL_ENTITY_CONFIGURATION_VERSION=e2e-reviewed-fixture-v1
      - PAYMENT_LEGAL_ENTITY_REVIEWED=true
      - PAYMENT_FOUNDING_PROMOTION_ENABLED=true
      - PAYMENT_FOUNDING_PROMOTION_RELEASE_AUTHORISED=true
      - PAYMENT_DEMO_PURCHASE_ENABLED=false
      - PAYMENT_LEGACY_STRIPE_CONFIRMATION_ENABLED=false

  payment-postgres:

  stripe-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - EXTERNAL_PROVIDER_MODE=FIXTURE
      - SYSTEM_DATA_SERVICE_URL=http://system-data-service:8103
      - FIXTURE_DATASET_ID=${FIXTURE_DATASET_ID:-uk-software-developer-demo}
      - FIXTURE_DATASET_VERSION=${FIXTURE_DATASET_VERSION:-1.2.0}
      - FIXTURE_SCENARIO=${FIXTURE_SCENARIO:-DEMO_READY}
      - STRIPE_FIXTURE_PAYMENT_CONTROL_ENABLED=true
      - STRIPE_FIXTURE_PAYMENT_CONTROL_TOKEN=${ENVIRONMENT_DATA_TOKEN:?Generate the selected untracked environment file}
      - STRIPE_FIXTURE_WEBHOOK_SECRET=${ENVIRONMENT_DATA_TOKEN:?Generate the selected untracked environment file}
      - STRIPE_LEGACY_CHECKOUT_ENABLED=false
      - STRIPE_SUCCESS_URL=http://localhost:${E2E_FRONTEND_PORT:-3100}/payment/success
      - STRIPE_CANCEL_URL=http://localhost:${E2E_FRONTEND_PORT:-3100}/payment/cancel

  payment-gateway:
    ports: !override []
    environment:
      - SPRING_PROFILES_ACTIVE=e2e

  job-seeker-copilot-client:
    ports: !override
      - "127.0.0.1:${E2E_FRONTEND_PORT:-3100}:3000"
    environment:
      - NODE_ENV=production
      - BFF_PASSWORD_RESET_RATE_MAXIMUM=100
      - LEGAL_DOCUMENTS_REVIEWED=true
      - LEGAL_EFFECTIVE_DATE=2026-08-15
      - LEGAL_VERSION=2026-08-15
      - LEGAL_ENTITY_TYPE=SOLE_TRADER
      - TAX_STATUS=NOT_VAT_REGISTERED
      - LEGAL_ENTITY_NAME=Local Acceptance Seller
      - TRADING_NAME=Job Seeker Copilot Local Acceptance
      - BUSINESS_ADDRESS=1 Acceptance Street, London, SW1A 1AA
      - PRIVACY_EMAIL=privacy@local.jobseekercopilot.test
      - SUPPORT_EMAIL=support@local.jobseekercopilot.test
      - ICO_REGISTRATION_STATUS=NOT_REQUIRED_CONFIRMED
      - ACCOUNT_DELETION_COMPLETION_DAYS=35
      - DOCUMENT_DELETION_COMPLETION_DAYS=35
      - SECURITY_LOG_RETENTION_DAYS=90
      - SUPPORT_RECORD_RETENTION_DAYS=365
      - FINANCIAL_RECORD_RETENTION_YEARS=7

networks:
  host-access:
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
