name: Story
description: Describe one testable slice beneath an existing Feature.
title: "[Story] "
labels:
  - enhancement
body:
  - type: input
    id: parent
    attributes:
      label: Parent Feature
      description: Link the existing Feature. Do not create an additional Epic for v1.1.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: User and context
      description: As a user/operator/partner, what context makes this slice necessary?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Required behaviour
      description: State the observable behavior and important failure behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and constraints
  - type: textarea
    id: testing
    attributes:
      label: Testing requirements
      description: Include automated, accessibility, security, failure, rollback or manual evidence as relevant.
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release target
      options:
        - Live / v1.0
        - v1.1
        - Post-v1.1
        - Future
    validations:
      required: true
