name: AWS Public Beta Provider Secret Seeding

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEED APPROVED JOB PROVIDER SECRETS public-beta
        required: true
        type: string

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-aws
    concurrency:
      group: jsc-public-beta-aws-mutation
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'SEED APPROVED JOB PROVIDER SECRETS public-beta'
      - name: Verify protected production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/aws/verify_github_environment_protection.sh
          "$GITHUB_REPOSITORY" production-aws
          "$GITHUB_REPOSITORY_OWNER" "$GITHUB_ACTOR"
      - name: Configure protected AWS apply role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: jsc-${{ github.run_id }}-provider-secrets
          role-duration-seconds: 1800
      - name: Seed and verify approved provider credentials without output
        env:
          AWS_REGION: eu-west-2
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          umask 077
          secret_file="${RUNNER_TEMP}/approved-job-provider-secrets.env"
          cleanup() {
            if [ -f "$secret_file" ]; then
              command -v shred >/dev/null && shred -u "$secret_file" || rm -f "$secret_file"
            fi
          }
          trap cleanup EXIT HUP INT TERM
          for name in REED_API_KEY ADZUNA_APP_ID ADZUNA_APP_KEY JSEARCH_API_KEY; do
            value=${!name:-}
            test ${#value} -ge 8
            case "$value" in
              *$'\n'*|*$'\r'*) echo "Invalid multiline provider credential: $name" >&2; exit 2 ;;
            esac
          done
          {
            printf 'REED_API_KEY=%s\n' "$REED_API_KEY"
            printf 'ADZUNA_APP_ID=%s\n' "$ADZUNA_APP_ID"
            printf 'ADZUNA_APP_KEY=%s\n' "$ADZUNA_APP_KEY"
            printf 'JSEARCH_API_KEY=%s\n' "$JSEARCH_API_KEY"
          } > "$secret_file"
          chmod 0600 "$secret_file"
          scripts/aws/seed-approved-job-provider-secrets.py \
            --secrets-env-file "$secret_file" \
            --confirmation 'SEED APPROVED JOB PROVIDER SECRETS public-beta'
