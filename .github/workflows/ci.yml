name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON
        run: |
          python3 -m json.tool config/services.json >/dev/null
          python3 -m json.tool config/contracts-lock.json >/dev/null
          python3 -m json.tool config/runtime-environment.schema.json >/dev/null
          python3 -m json.tool scripts/clients/config/service_dependencies.json >/dev/null
      - name: Reject tracked credential literals
        run: python3 -m scripts.security.check_tracked_secrets
      - name: Validate contract and generated-client lock
        run: python3 -m scripts.contracts.validate_lock
      - name: Test workspace tooling
        run: python3 -m unittest discover -s tests
      - name: Compile Python
        run: python3 -m compileall -q scripts
      - name: Exercise bootstrap dry run
        run: python3 scripts/workspace/bootstrap.py

  build-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate inherited parent POM
        run: mvn -B -Dcheckstyle.skip=true -f build-tools/pom.xml validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: |
          python3 scripts/security/generate_profile_env.py --profile local --output .env
          python3 scripts/security/generate_profile_env.py --profile e2e --output .env.e2e
          python3 scripts/security/generate_profile_env.py --profile live-provider --output .env.live
          docker compose --env-file .env -f docker-compose.yml config --quiet
          docker compose --env-file .env.e2e -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
          docker compose --env-file .env.live -f docker-compose.yml -f docker-compose.live.yml config --quiet
          python3 scripts/security/validate_compose_runtime.py --profile local --env-file .env
          python3 scripts/security/validate_compose_runtime.py --profile e2e --env-file .env.e2e --overlay docker-compose.e2e.yml
          python3 scripts/security/validate_compose_runtime.py --profile live-provider --env-file .env.live --overlay docker-compose.live.yml
