name: Docs Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs-site/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict --config-file docs-site/mkdocs.yml
      - name: Verify custom-domain artifact
        run: test "$(cat docs-site/site/CNAME)" = "docs.jobseekercopilot.com"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
