x-java-small: &java-small
  mem_limit: 384m
  environment:
    JAVA_TOOL_OPTIONS: >-
      -Xms24m -Xmx160m
      -XX:MaxMetaspaceSize=96m
      -XX:ReservedCodeCacheSize=32m
      -Xss512k
      -XX:+UseSerialGC

x-java-heavy: &java-heavy
  mem_limit: 512m
  environment:
    JAVA_TOOL_OPTIONS: >-
      -Xms32m -Xmx240m
      -XX:MaxMetaspaceSize=112m
      -XX:ReservedCodeCacheSize=48m
      -Xss512k
      -XX:+UseSerialGC

x-java-profile: &java-profile
  mem_limit: 512m
  environment:
    JAVA_TOOL_OPTIONS: >-
      -Xms32m -Xmx192m
      -XX:MaxMetaspaceSize=160m
      -XX:ReservedCodeCacheSize=48m
      -Xss512k
      -XX:+UseSerialGC

x-postgres-small: &postgres-small
  mem_limit: 256m
  command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - work_mem=2MB
    - -c
    - maintenance_work_mem=24MB
    - -c
    - max_connections=40

services:
  postcode-io-gateway:
    <<: *java-small
  google-maps-gateway:
    <<: *java-small
  location-service:
    <<: *java-small
  location-gateway:
    <<: *java-small
  authentication-service:
    <<: *java-profile
  user-profile-service:
    <<: *java-profile
  user-management-gateway:
    <<: *java-small
  reed-gateway:
    <<: *java-small
  adzuna-gateway:
    <<: *java-small
  jsearch-gateway:
    <<: *java-small
  job-matching-service:
    <<: *java-small
  job-finder-gateway:
    <<: *java-small
  document-store-service:
    <<: *java-heavy
    # Family/history reads and reconciliation retain enough mapped metadata
    # to exhaust the shared 160 MiB heap under normal localhost use. Give the
    # store the same bounded 240 MiB heap as the other document-processing
    # services while retaining native headroom inside the 512 MiB container.
    mem_limit: 512m
  application-tracker-service:
    <<: *java-small
    mem_limit: 512m
  reporting-service:
    <<: *java-small
  reporting-gateway:
    <<: *java-small
  payment-service:
    <<: *java-small
    # Ledger reconciliation and Hibernate metadata briefly exceed the shared
    # small-service ceiling during a cold retained-data startup. Keep the
    # bounded 160 MiB heap, but leave enough native headroom to avoid OOM kill.
    mem_limit: 512m
  stripe-gateway:
    <<: *java-small
  payment-gateway:
    <<: *java-small

  system-data-service:
    <<: *java-heavy
  job-service:
    <<: *java-heavy
  llm-gateway:
    <<: *java-heavy
  document-export-service:
    <<: *java-heavy
  cv-cover-letter-service:
    <<: *java-heavy
  document-generation-gateway:
    <<: *java-heavy

  authentication-postgres:
    <<: *postgres-small
  user-profile-postgres:
    <<: *postgres-small
  job-service-postgres:
    <<: *postgres-small
  document-generation-postgres:
    <<: *postgres-small
  document-store-postgres:
    <<: *postgres-small
  application-tracker-postgres:
    <<: *postgres-small
  payment-postgres:
    <<: *postgres-small

  job-seeker-copilot-client:
    mem_limit: 384m
    environment:
      NODE_OPTIONS: --max-old-space-size=192
