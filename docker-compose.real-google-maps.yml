services:
  google-maps-gateway:
    environment:
      GOOGLE_MAPS_ENABLED: "true"
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: google_maps_api_key
        target: GOOGLE_MAPS_API_KEY
    networks:
      - job-seeker-network
      - google-maps-egress-network

  location-service:
    environment:
      GOOGLE_MAPS_ENABLED: "true"

networks:
  google-maps-egress-network:
    driver: bridge
    internal: false

secrets:
  google_maps_api_key:
    environment: GOOGLE_MAPS_API_KEY
